<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Stills from the academic and personal journey of Sirajam Munira." />
  <title>Stills | Sirajam Munira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div id="site-header"></div>

  <main class="container page-main">
    <div class="page-heading">
      <p class="section-kicker">Stills</p>
      <h1>Stills</h1>
      <p class="page-intro">A few moments from research, conferences, teaching, travel, and life along the way.</p>
    </div>

    <!--
      Add your images to assets/images/stills/ using the filenames below.
      You can also duplicate a <figure> block to add more photos.
    -->
    <section class="stills-grid">
      <figure class="still-card">
        <div class="still-image-wrap"><img src="assets/images/stills/Still2.jpeg" alt="Conference / Research" onerror="this.style.display='none'; this.parentElement.classList.add('still-placeholder');"></div>
        <figcaption>
          <h2>AIME 2026</h2>
          <p>The least experienced in the room, but I made it into the room; presenting our Zero-Shot LLM for CKD work at AIME 2026.
</p>
        </figcaption>
      </figure>
      <figure class="still-card">
        <div class="still-image-wrap"><img src="assets/images/stills/Still1.jpg" alt="Teaching" onerror="this.style.display='none'; this.parentElement.classList.add('still-placeholder');"></div>
        <figcaption>
          <h2>Summer Camp Java Instructor</h2>
          <p>Teaching Java to Grades 7–12 at STEP RPI Summer Camp, from programming fundamentals to advanced problem-solving with LeetCode.</p>
        </figcaption>
      </figure>
      <figure class="still-card">
        <div class="still-image-wrap"><img src="assets/images/stills/Still3.jpeg" alt="Chasing Waterfalls" onerror="this.style.display='none'; this.parentElement.classList.add('still-placeholder');"></div>
        <figcaption>
          <h2>Campus Life</h2>
          <p>Just me, a giant waterfall, and a moment worth sitting still for.</p>
        </figcaption>
      </figure>
      <figure class="still-card">
        <div class="still-image-wrap"><img src="assets/images/stills/Still4.jpeg" alt="Community" onerror="this.style.display='none'; this.parentElement.classList.add('still-placeholder');"></div>
        <figcaption>
          <h2>A Journey Worth the Miles</h2>
          <p>Baba flew all the way from Bangladesh to be there for my MS commencement at RPI. Having him beside me made the milestone even more special.</p>
        </figcaption>
      </figure>
      <figure class="still-card">
        <div class="still-image-wrap"><img src="assets/images/stills/Still5.jpeg" alt="Community" onerror="this.style.display='none'; this.parentElement.classList.add('still-placeholder');"></div>
        <figcaption>
          <h2>Under a Thousand Stars</h2>
          <p>Florida nights, endless stars, and the kind of company that makes you forget about time.</p>
        </figcaption>
      </figure>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="./script.js"></script>
</body>
</html>
